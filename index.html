<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Vibe Browser</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{position:relative;font-family:var(--font,"Segoe UI",system-ui,sans-serif);background:var(--s);color:var(--on);display:flex;flex-direction:column;font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--p);outline-offset:2px}
#tabs{display:flex;align-items:center;gap:6px;padding:8px 10px 0;background:var(--sc);zoom:var(--ui,1)}
#tablist{display:flex;gap:4px;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border-radius:calc(14px*var(--k)) calc(14px*var(--k)) 0 0;flex:0 1 var(--tw,220px);min-width:60px;cursor:pointer;color:var(--on2)}
.tab.on{background:var(--s);color:var(--on)}
.tab img{width:16px;height:16px;border-radius:4px}
.tab span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab button{width:22px;height:22px;border-radius:50%;opacity:.7}
.tab button:hover,.ib:hover:not(:disabled){background:var(--pc)}
.ib{width:38px;height:38px;border-radius:calc(19px*var(--k));font-size:19px;display:grid;place-items:center}
.ib:disabled{opacity:.35;cursor:default}
#incbadge{display:none;padding:4px 12px;border-radius:12px;background:var(--p);color:var(--onp);font-size:12px;font-weight:600}
body.inc #incbadge{display:block}
#bar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--s);position:relative;zoom:var(--ui,1)}
#omni{flex:1;height:40px;border-radius:calc(20px*var(--k));border:2px solid transparent;background:var(--sh);color:var(--on);padding:0 18px;font:inherit;font-size:15px;margin:0 6px}
#omni:focus{border-color:var(--p);outline:0}
#load{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--p)}
#load.on{animation:ld 1.4s ease-in-out infinite}
@keyframes ld{0%{left:0;width:0}50%{left:20%;width:60%}100%{left:100%;width:0}}
#dl{position:relative}
#dl.busy{color:var(--p);animation:pls 1.2s infinite}
@keyframes pls{50%{opacity:.4}}
#views{flex:1;position:relative}
webview{position:absolute;inset:0;display:none}
webview.on{display:flex}
#ntp{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 25% 20%,var(--w1),transparent 55%),radial-gradient(circle at 80% 80%,var(--w2),transparent 50%),var(--s)}
#ntp.on{display:flex}
#ntp h1{font-size:56px;font-weight:300;margin:0;letter-spacing:-1px}
#incnote{display:none;margin:-10px 0 0;max-width:480px;text-align:center;color:var(--on2)}
body.inc #incnote{display:block}
#ntpq{width:min(560px,80%);height:56px;border-radius:calc(28px*var(--k));border:0;background:var(--sc);color:var(--on);padding:0 26px;font:inherit;font-size:17px}
#links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:640px}
.chip{padding:14px 22px;border-radius:calc(20px*var(--k));background:var(--pc);color:var(--onpc);font-size:15px}
.chip:nth-child(3n+2){background:var(--tcc);color:var(--ontc);border-radius:calc(28px*var(--k)) calc(12px*var(--k)) calc(28px*var(--k)) calc(12px*var(--k))}
.chip:nth-child(3n){background:var(--scc);color:var(--onsc)}
/* всплывающие окна */
#pscrim,#scrim{position:absolute;inset:0;display:none}
#pscrim{z-index:25}#scrim{z-index:20;background:rgba(0,0,0,.35)}
#pscrim.on,#scrim.on{display:block}
.pop{position:absolute;top:calc(92px*var(--ui,1));right:10px;background:var(--sc);border-radius:calc(24px*var(--k));padding:8px;z-index:26;display:none;box-shadow:0 8px 28px rgba(0,0,0,.3);min-width:250px}
.pop.on{display:block}
#menu button{display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;border-radius:calc(16px*var(--k));text-align:left;font-size:15px}
#menu button:hover{background:var(--pc)}
#menu kbd{margin-left:auto;font:inherit;font-size:12px;color:var(--on2)}
#dlpop{width:380px;max-height:70vh;overflow:auto;padding:14px}
#dlpop h4{margin:2px 6px 10px;font-weight:500;font-size:16px}
.dl{display:flex;gap:10px;align-items:center;padding:10px 6px}
.dl .nm{flex:1;min-width:0}
.dl b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl small,.muted{color:var(--on2)}
.pb{height:4px;border-radius:2px;background:var(--sh);margin:6px 0 3px;overflow:hidden}.pb i{display:block;height:100%;background:var(--p)}
.sm{padding:6px 12px;border-radius:calc(14px*var(--k));background:var(--pc);color:var(--onpc);font-size:12px;white-space:nowrap}
/* боковые панели */
.side{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--sc);z-index:21;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:22px 24px 32px;border-radius:calc(28px*var(--k)) 0 0 calc(28px*var(--k))}
.side.on{transform:none}
.side h2{margin:0 0 6px;font-weight:400;font-size:28px}
.side h3{margin:22px 0 10px;font-size:13px;font-weight:600;color:var(--p)}
.side .x{position:absolute;top:16px;right:18px}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:40px;border-radius:calc(20px*var(--k));background:var(--sh)}
.seg button.sel{background:var(--p);color:var(--onp)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.sel{border-color:var(--on);border-radius:calc(12px*var(--k))}
.side label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 6px}
.side input[type=range]{width:100%;accent-color:var(--p)}
#hue{-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,#f55,#fa5,#ee5,#5d5,#5de,#55f,#d5d,#f55)}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--p);border:3px solid var(--sc)}
.side select,.side input[type=text]{width:100%;height:42px;border-radius:calc(14px*var(--k));border:0;background:var(--sh);color:var(--on);padding:0 14px;font:inherit;margin-top:8px}
.side input[type=checkbox]{width:20px;height:20px;accent-color:var(--p)}
.btn{padding:10px 18px;border-radius:calc(20px*var(--k));background:var(--pc);color:var(--onpc);margin:4px 8px 4px 0}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:calc(14px*var(--k));cursor:pointer}
.hrow:hover{background:var(--pc)}
.hrow .nm{flex:1;min-width:0}
.hrow b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow small{display:block;color:var(--on2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .t{width:42px;flex:none}
.side.wide{width:min(620px,100%)}
#sq{width:100%;height:44px;border-radius:calc(22px*var(--k));border:0;background:var(--sh);color:var(--on);padding:0 18px;font:inherit;margin-top:12px}
#scats{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}
#scats button{padding:7px 14px;border-radius:calc(16px*var(--k));background:var(--sh);font-size:13px}
#scats button.sel{background:var(--p);color:var(--onp)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4px;border-bottom:1px solid var(--sh)}
.srow.col{flex-direction:column;align-items:stretch}
.srow .tx{flex:1;min-width:0}
.srow .tx small{display:block;color:var(--on2);margin-top:3px;font-size:12px}
.srow .ctl{flex:none;display:flex;gap:6px;align-items:center;max-width:60%}
.srow.col .ctl{max-width:none;flex-wrap:wrap}
.srow select{width:210px;margin:0}
.srow input[type=range]{width:190px}
.srow .ctl input[type=text]{width:220px;margin:0}
.srow .seg{min-width:250px}
.srow .btn{margin:0}
.srow .info{color:var(--on2);font-size:13px}
.tgl{width:48px;height:28px;border-radius:14px;background:var(--sh);border:2px solid var(--on2);position:relative;transition:.2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--on2);transition:.2s}
.tgl.on{background:var(--p);border-color:var(--p)}
.tgl.on::after{left:23px;background:var(--onp)}
#ntpclock{text-align:center;color:var(--on2);font-size:15px}
#ntpclock b{display:block;font-size:84px;font-weight:300;color:var(--on);line-height:1;letter-spacing:-2px}
#ntp.bg-plain{background:var(--s)}
#ntp.bg-accent{background:var(--pc)}
.noicons .tab img{display:none}
.noanim *{transition:none!important;animation:none!important}
body.noprog #load{display:none}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--on);color:var(--s);padding:10px 18px;border-radius:calc(16px*var(--k));z-index:40;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1}
/* ===== Material You v2 ===== */
body{background:var(--sc)}
#tabs{background:transparent;padding:10px 12px 4px;gap:8px}
#tablist{flex:0 1 auto;gap:6px;align-items:center}
.tab{height:40px;border-radius:calc(20px*var(--k));padding:0 8px 0 10px;background:transparent;color:var(--on2);transition:background .2s,border-radius .25s,color .2s}
.tab:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}
.tab.on{background:var(--pc);color:var(--onpc);border-radius:calc(16px*var(--k))}
.tab img{width:20px;height:20px;border-radius:calc(7px*var(--k))}
.tab button{width:26px;height:26px;border-radius:calc(13px*var(--k));opacity:.75;font-size:16px}
.tab button:hover{background:color-mix(in srgb,currentColor 14%,transparent);opacity:1}
#incbadge{margin-left:auto;border-radius:calc(14px*var(--k));padding:6px 14px}
.plus{flex:none;margin-left:2px;background:var(--tcc);color:var(--ontc);width:40px;height:40px;border-radius:calc(20px*var(--k));font-size:22px}
.plus:hover:not(:disabled){background:var(--tcc);filter:brightness(.94)}
#bar{background:transparent;padding:4px 12px 10px;gap:6px}
.ib{color:var(--on);transition:background .2s,border-radius .2s}
.ib:hover:not(:disabled){background:color-mix(in srgb,var(--on) 10%,transparent)}
.ib:active:not(:disabled){border-radius:calc(11px*var(--k));background:color-mix(in srgb,var(--on) 16%,transparent)}
#back,#fwd{background:var(--sh)}
#back:hover:not(:disabled),#fwd:hover:not(:disabled){background:var(--pc)}
#reload{background:var(--pc);color:var(--onpc)}
#reload.busy{border-radius:calc(12px*var(--k));background:var(--p);color:var(--onp)}
.ow{flex:1;position:relative;display:flex;margin:0 4px}
.ow #omni{flex:1;margin:0;width:100%;height:46px;padding:0 20px 0 52px;border-radius:calc(23px*var(--k));background:var(--sh)}
.ow #omni:focus{border-color:var(--p);background:var(--s)}
#oic{position:absolute;left:6px;top:6px;width:34px;height:34px;display:grid;place-items:center;border-radius:calc(17px*var(--k));background:var(--pc);color:var(--onpc);font-size:15px;filter:grayscale(1);pointer-events:none}
#load{height:4px;border-radius:2px;bottom:2px}
#views{margin:0 10px 10px;border-radius:calc(28px*var(--k));overflow:hidden;background:var(--s);box-shadow:0 1px 4px rgba(0,0,0,.18)}
webview{border-radius:inherit}
body.nocard #views{margin:0;border-radius:0;box-shadow:none}
.pop{border-radius:calc(28px*var(--k));padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.28),0 0 0 1px color-mix(in srgb,var(--on) 6%,transparent)}
#menu{min-width:300px}
#menu button{border-radius:calc(20px*var(--k));padding:10px 14px;transition:background .15s}
#menu button:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}
#menu button>span{width:40px;height:40px;display:grid;place-items:center;border-radius:calc(14px*var(--k));background:var(--pc);color:var(--onpc);font-size:18px;filter:grayscale(.4);transition:border-radius .2s}
#menu button:nth-child(2)>span{background:var(--tcc);color:var(--ontc)}
#menu button:nth-child(3)>span{background:var(--scc);color:var(--onsc)}
#menu button:hover>span{border-radius:calc(20px*var(--k))}
#menu button:nth-child(2):hover>span{border-radius:calc(8px*var(--k))}
.dl{background:var(--s);border-radius:calc(20px*var(--k));padding:12px;margin-bottom:6px}
.pb{height:6px;border-radius:3px}
.side{border-radius:calc(32px*var(--k)) 0 0 calc(32px*var(--k));box-shadow:-8px 0 32px rgba(0,0,0,.25)}
.seg{gap:3px}
.seg button{background:var(--sc);border-radius:calc(8px*var(--k));transition:border-radius .2s,background .2s}
.seg button:first-child{border-radius:calc(20px*var(--k)) calc(8px*var(--k)) calc(8px*var(--k)) calc(20px*var(--k))}
.seg button:last-child{border-radius:calc(8px*var(--k)) calc(20px*var(--k)) calc(20px*var(--k)) calc(8px*var(--k))}
.seg button.sel{background:var(--p);color:var(--onp);border-radius:calc(20px*var(--k))}
#sbody{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.srow{background:var(--sh);border:0;border-radius:calc(20px*var(--k));padding:14px 18px}
.side select,.side input[type=text]{background:var(--sc)}
.srow input[type=text]{background:var(--sc)}
.tgl{background:var(--sc)}
.tgl.on{background:var(--p)}
#scats button{border-radius:calc(10px*var(--k))}
#scats button.sel{background:var(--pc);color:var(--onpc);border-radius:calc(16px*var(--k))}
#ntp{overflow:hidden}
#ntp::before,#ntp::after{content:'';position:absolute;z-index:0;pointer-events:none;animation:morph 14s ease-in-out infinite alternate}
#ntp::before{width:420px;height:420px;left:-120px;top:-140px;background:var(--pc);opacity:.55;border-radius:63% 37% 54% 46%/55% 48% 52% 45%}
#ntp::after{width:340px;height:340px;right:-90px;bottom:-110px;background:var(--tcc);opacity:.6;border-radius:38% 62% 63% 37%/41% 44% 56% 59%;animation-delay:-5s}
#ntp.bg-plain::before,#ntp.bg-plain::after{display:none}
#ntp>*{position:relative;z-index:1}
@keyframes morph{50%{transform:rotate(25deg) scale(1.08)}100%{transform:rotate(-10deg) scale(.95)}}
#ntpq{height:60px;border-radius:calc(30px*var(--k));background:var(--sh);padding:0 28px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
#ntpq:focus{outline:2px solid var(--p)}
#ntpclock b{color:var(--p)}
.chip{display:flex;align-items:center;gap:10px;padding:8px 22px 8px 8px;font-size:15px;transition:border-radius .2s,filter .2s}
.chip .av{width:36px;height:36px;display:grid;place-items:center;font-weight:600;background:var(--p);color:var(--onp);border-radius:50%}
.chip:nth-child(3n+2) .av{border-radius:calc(12px*var(--k))}
.chip:nth-child(3n) .av{border-radius:calc(18px*var(--k)) calc(6px*var(--k)) calc(18px*var(--k)) calc(6px*var(--k))}
.chip:hover{filter:brightness(.95)}
/* ===== Material You v3: иконки, полноэкранные настройки, свои цвета ===== */
.ib svg,.tab button svg{display:block;pointer-events:none}
i[data-i]{display:grid;place-items:center;font-style:normal}
#dl,#dots{background:var(--sh)}
#dl:hover,#dots:hover{background:var(--pc)}
#back{border-radius:calc(19px*var(--k)) calc(6px*var(--k)) calc(6px*var(--k)) calc(19px*var(--k));margin-right:-4px}
#fwd{border-radius:calc(6px*var(--k)) calc(19px*var(--k)) calc(19px*var(--k)) calc(6px*var(--k))}
#back:active:not(:disabled),#fwd:active:not(:disabled){border-radius:calc(12px*var(--k))}
#oic{filter:none}
body.inc #incbadge{display:flex;align-items:center;gap:6px}
.tab .fav{display:grid;place-items:center;width:20px;height:20px;flex:none}
.noicons .tab .fav{display:none}
#menu button>span{filter:none}
.fi{width:40px;height:40px;display:grid;place-items:center;border-radius:calc(14px*var(--k));background:var(--pc);color:var(--onpc);flex:none}
.chipx svg{margin-left:8px;vertical-align:middle}
#logo{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
/* настройки на весь экран */
#set.side{left:0;width:auto;transform:none;display:none;border-radius:0;box-shadow:none;padding:0;overflow:hidden;z-index:30;background:var(--s)}
#set.side.on{display:flex;animation:fin .25s ease-out}
@keyframes fin{from{opacity:0;transform:scale(.985)}}
#snav{width:310px;flex:none;background:var(--sc);padding:20px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;border-radius:0 calc(36px*var(--k)) calc(36px*var(--k)) 0}
.shead{display:flex;align-items:center;gap:10px}
.shead h2{margin:0;font-size:26px}
#snav #sq{margin:4px 0 0}
#scats{display:flex;flex-direction:column;flex-wrap:nowrap;gap:4px;margin:6px 0}
#scats button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 18px 12px 12px;text-align:left;font-size:15px;background:transparent;border-radius:calc(26px*var(--k));transition:background .2s,border-radius .25s}
#scats button:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}
#scats button.sel{background:var(--pc);color:var(--onpc);border-radius:calc(30px*var(--k)) calc(16px*var(--k)) calc(16px*var(--k)) calc(30px*var(--k))}
.ni{display:grid;place-items:center;width:42px;height:32px;border-radius:calc(16px*var(--k))}
#scats button.sel .ni{background:var(--p);color:var(--onp)}
#smain{flex:1;min-width:0;overflow-y:auto;padding:30px 36px 48px}
#chead,#sbody{max-width:780px;margin-left:auto;margin-right:auto}
#chead{display:flex;align-items:center;gap:20px;margin-bottom:22px}
#chead h1{margin:0;font-weight:400;font-size:38px;letter-spacing:-.5px}
.blob{width:68px;height:68px;display:grid;place-items:center;background:var(--pc);color:var(--onpc);transition:border-radius .4s;flex:none}
.blob.b0{border-radius:62% 38% 56% 44%/52% 58% 42% 48%}
.blob.b1{border-radius:40% 60% 44% 56%/58% 42% 58% 42%}

/* цвета: готовые, свои и кнопка «+» */
.sw button{transition:border-radius .2s,transform .15s}
.sw>button:nth-child(3n+2),.sw .cs:nth-child(3n+2) button:not(.del){border-radius:calc(14px*var(--k))}
.sw>button:nth-child(3n),.sw .cs:nth-child(3n) button:not(.del){border-radius:calc(19px*var(--k)) calc(8px*var(--k)) calc(19px*var(--k)) calc(8px*var(--k))}
.sw button.sel{border-color:var(--on);border-radius:calc(12px*var(--k))}
.cs{position:relative;display:inline-flex}
.sw .del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border:0;border-radius:50%;background:var(--on);color:var(--s);display:none;place-items:center;padding:0}
.cs:hover .del{display:grid}
.swadd{width:38px;height:38px;display:grid;place-items:center;border-radius:calc(19px*var(--k));background:var(--sc);color:var(--on);border:2px dashed var(--on2)}
.swadd:hover{background:var(--pc);color:var(--onpc)}
.composer{background:var(--sc);border-radius:calc(24px*var(--k));padding:16px 18px;margin-top:10px;display:flex;flex-direction:column;gap:4px}
.composer[hidden]{display:none}
.composer label{margin:8px 0 4px}
.prev{display:flex;gap:10px;margin-bottom:4px}
.prev span{width:56px;height:56px;border-radius:50%}
.prev span:nth-child(2){border-radius:calc(18px*var(--k))}
.prev span:nth-child(3){border-radius:calc(28px*var(--k)) calc(10px*var(--k)) calc(28px*var(--k)) calc(10px*var(--k))}
.huebar{-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,#f55,#fa5,#ee5,#5d5,#5de,#55f,#d5d,#f55)}
.huebar::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--p);border:3px solid var(--sc)}
.composer input[type=range]{width:100%}
.crow{display:flex;gap:8px;margin-top:12px}

let setBuilt = false;

function fmtTime(d, sec) {

  return d.toLocaleDateString(S.dLoc, { ...o, ...tz });

let tickT;
