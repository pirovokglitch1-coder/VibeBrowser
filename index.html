<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Vibe Browser</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{position:relative;font-family:var(--font,"Segoe UI",system-ui,sans-serif);background:var(--s);color:var(--on);display:flex;flex-direction:column;font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--p);outline-offset:2px}
#tabs{display:flex;align-items:center;gap:6px;padding:8px 10px 0;background:var(--sc);zoom:var(--ui,1)}
#tablist{display:flex;gap:4px;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border-radius:calc(14px*var(--k)) calc(14px*var(--k)) 0 0;flex:0 1 var(--tw,220px);min-width:60px;cursor:pointer;color:var(--on2)}
.tab.on{background:var(--s);color:var(--on)}
.tab img{width:16px;height:16px;border-radius:4px}
.tab span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab button{width:22px;height:22px;border-radius:50%;opacity:.7}
.tab button:hover,.ib:hover:not(:disabled){background:var(--pc)}
.ib{width:38px;height:38px;border-radius:calc(19px*var(--k));font-size:19px;display:grid;place-items:center}
.ib:disabled{opacity:.35;cursor:default}
#incbadge{display:none;padding:4px 12px;border-radius:12px;background:var(--p);color:var(--onp);font-size:12px;font-weight:600}
body.inc #incbadge{display:block}
#bar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--s);position:relative;zoom:var(--ui,1)}
#omni{flex:1;height:40px;border-radius:calc(20px*var(--k));border:2px solid transparent;background:var(--sh);color:var(--on);padding:0 18px;font:inherit;font-size:15px;margin:0 6px}
#omni:focus{border-color:var(--p);outline:0}
#load{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--p)}
#load.on{animation:ld 1.4s ease-in-out infinite}
@keyframes ld{0%{left:0;width:0}50%{left:20%;width:60%}100%{left:100%;width:0}}
#dl{position:relative}
#dl.busy{color:var(--p);animation:pls 1.2s infinite}
@keyframes pls{50%{opacity:.4}}
#views{flex:1;position:relative}
webview{position:absolute;inset:0;display:none}
webview.on{display:flex}
#ntp{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 25% 20%,var(--w1),transparent 55%),radial-gradient(circle at 80% 80%,var(--w2),transparent 50%),var(--s)}
#ntp.on{display:flex}
#ntp h1{font-size:56px;font-weight:300;margin:0;letter-spacing:-1px}
#incnote{display:none;margin:-10px 0 0;max-width:480px;text-align:center;color:var(--on2)}
body.inc #incnote{display:block}
#ntpq{width:min(560px,80%);height:56px;border-radius:calc(28px*var(--k));border:0;background:var(--sc);color:var(--on);padding:0 26px;font:inherit;font-size:17px}
#links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:640px}
.chip{padding:14px 22px;border-radius:calc(20px*var(--k));background:var(--pc);color:var(--onpc);font-size:15px}
.chip:nth-child(3n+2){background:var(--tcc);color:var(--ontc);border-radius:calc(28px*var(--k)) calc(12px*var(--k)) calc(28px*var(--k)) calc(12px*var(--k))}
.chip:nth-child(3n){background:var(--scc);color:var(--onsc)}
/* всплывающие окна */
#pscrim,#scrim{position:absolute;inset:0;display:none}
#pscrim{z-index:25}#scrim{z-index:20;background:rgba(0,0,0,.35)}
#pscrim.on,#scrim.on{display:block}
.pop{position:absolute;top:calc(92px*var(--ui,1));right:10px;background:var(--sc);border-radius:calc(24px*var(--k));padding:8px;z-index:26;display:none;box-shadow:0 8px 28px rgba(0,0,0,.3);min-width:250px}
.pop.on{display:block}
#menu button{display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;border-radius:calc(16px*var(--k));text-align:left;font-size:15px}
#menu button:hover{background:var(--pc)}
#menu kbd{margin-left:auto;font:inherit;font-size:12px;color:var(--on2)}
#dlpop{width:380px;max-height:70vh;overflow:auto;padding:14px}
#dlpop h4{margin:2px 6px 10px;font-weight:500;font-size:16px}
.dl{display:flex;gap:10px;align-items:center;padding:10px 6px}
.dl .nm{flex:1;min-width:0}
.dl b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl small,.muted{color:var(--on2)}
.pb{height:4px;border-radius:2px;background:var(--sh);margin:6px 0 3px;overflow:hidden}.pb i{display:block;height:100%;background:var(--p)}
.sm{padding:6px 12px;border-radius:calc(14px*var(--k));background:var(--pc);color:var(--onpc);font-size:12px;white-space:nowrap}
/* боковые панели */
.side{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--sc);z-index:21;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:22px 24px 32px;border-radius:calc(28px*var(--k)) 0 0 calc(28px*var(--k))}
.side.on{transform:none}
.side h2{margin:0 0 6px;font-weight:400;font-size:28px}
.side h3{margin:22px 0 10px;font-size:13px;font-weight:600;color:var(--p)}
.side .x{position:absolute;top:16px;right:18px}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:40px;border-radius:calc(20px*var(--k));background:var(--sh)}
.seg button.sel{background:var(--p);color:var(--onp)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.sel{border-color:var(--on);border-radius:calc(12px*var(--k))}
.side label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 6px}
.side input[type=range]{width:100%;accent-color:var(--p)}
#hue{-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,#f55,#fa5,#ee5,#5d5,#5de,#55f,#d5d,#f55)}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--p);border:3px solid var(--sc)}
.side select,.side input[type=text]{width:100%;height:42px;border-radius:calc(14px*var(--k));border:0;background:var(--sh);color:var(--on);padding:0 14px;font:inherit;margin-top:8px}
.side input[type=checkbox]{width:20px;height:20px;accent-color:var(--p)}
.btn{padding:10px 18px;border-radius:calc(20px*var(--k));background:var(--pc);color:var(--onpc);margin:4px 8px 4px 0}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:calc(14px*var(--k));cursor:pointer}
.hrow:hover{background:var(--pc)}
.hrow .nm{flex:1;min-width:0}
.hrow b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow small{display:block;color:var(--on2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .t{width:42px;flex:none}
.side.wide{width:min(620px,100%)}
#sq{width:100%;height:44px;border-radius:calc(22px*var(--k));border:0;background:var(--sh);color:var(--on);padding:0 18px;font:inherit;margin-top:12px}
#scats{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}
#scats button{padding:7px 14px;border-radius:calc(16px*var(--k));background:var(--sh);font-size:13px}
#scats button.sel{background:var(--p);color:var(--onp)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4px;border-bottom:1px solid var(--sh)}
.srow.col{flex-direction:column;align-items:stretch}
.srow .tx{flex:1;min-width:0}
.srow .tx small{display:block;color:var(--on2);margin-top:3px;font-size:12px}
.srow .ctl{flex:none;display:flex;gap:6px;align-items:center;max-width:60%}
.srow.col .ctl{max-width:none;flex-wrap:wrap}
.srow select{width:210px;margin:0}
.srow input[type=range]{width:190px}
.srow .ctl input[type=text]{width:220px;margin:0}
.srow .seg{min-width:250px}
.srow .btn{margin:0}
.srow .info{color:var(--on2);font-size:13px}
.tgl{width:48px;height:28px;border-radius:14px;background:var(--sh);border:2px solid var(--on2);position:relative;transition:.2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--on2);transition:.2s}
.tgl.on{background:var(--p);border-color:var(--p)}
.tgl.on::after{left:23px;background:var(--onp)}
#ntpclock{text-align:center;color:var(--on2);font-size:15px}
#ntpclock b{display:block;font-size:84px;font-weight:300;color:var(--on);line-height:1;letter-spacing:-2px}
#ntp.bg-plain{background:var(--s)}
#ntp.bg-accent{background:var(--pc)}
.noicons .tab img{display:none}
.noanim *{transition:none!important;animation:none!important}
body.noprog #load{display:none}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--on);color:var(--s);padding:10px 18px;border-radius:calc(16px*var(--k));z-index:40;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#load.on{animation:none;width:100%}#dl.busy{animation:none}.side{transition:none}}
</style></head>
<body>
<div id="tabs"><div id="tablist"></div><span id="incbadge">🕶 Инкогнито</span><button class="ib" id="plus" title="Новая вкладка (Ctrl+T)">＋</button></div>
<div id="bar">
  <button class="ib" id="back" title="Назад">‹</button>
  <button class="ib" id="fwd" title="Вперёд">›</button>
  <button class="ib" id="reload" title="Обновить (Ctrl+R)">⟳</button>
  <input id="omni" placeholder="Введите адрес или запрос" autocomplete="off" spellcheck="false">
  <button class="ib" id="dl" title="Загрузки (Ctrl+J)">↓</button>
  <button class="ib" id="dots" title="Меню">⋮</button>
  <div id="load"></div>
</div>
<div id="views">
  <div id="ntp"><div id="ntpclock"></div><h1 id="ntph">Vibe Browser</h1><p id="incnote">Режим инкогнито: история, куки и данные сайтов не сохраняются после закрытия этого окна.</p><input id="ntpq"><div id="links"></div></div>
</div>

<div id="pscrim"></div>
<div class="pop" id="menu">
  <button id="mHist"><span>🕘</span>История<kbd>Ctrl+H</kbd></button>
  <button id="mSet"><span>⚙</span>Настройки</button>
  <button id="mInc"><span>🕶</span>Режим инкогнито<kbd>Ctrl+Shift+N</kbd></button>
</div>
<div class="pop" id="dlpop"><h4>Загрузки</h4><div id="dllist"></div><button class="btn" id="dlclear">Очистить список</button></div>

<div id="scrim"></div>
<aside class="side" id="hist" aria-label="История">
  <button class="ib x" data-close title="Закрыть">✕</button>
  <h2>История</h2>
  <input type="text" id="hq" placeholder="Поиск по истории">
  <div id="hlist"></div>
  <button class="btn" id="hclear" style="margin-top:16px">Очистить историю</button>
</aside>
<aside class="side wide" id="set" aria-label="Настройки">
  <button class="ib x" data-close title="Закрыть">✕</button>
  <h2>Настройки</h2>
  <input type="text" id="sq" placeholder="Поиск по настройкам" autocomplete="off">
  <div id="scats"></div>
  <div id="sbody"></div>
</aside>
<div id="toast"></div>
<script>
const { ipcRenderer } = require('electron');
const $ = s => document.querySelector(s);
const safe = f => { try { return f(); } catch (e) {} };
const INC = new URLSearchParams(location.search).get('incognito') === '1';
const PART = 'inc-' + Date.now(); // без префикса persist: — сессия живёт только в памяти
if (INC) document.body.classList.add('inc');

const hues = [265, 150, 20, 200, 330, 50, 0, 175];
const DEF = {
  theme: 'system', hue: 265, vib: 60, k: '1', ui: 100, tw: '220', anim: true, prog: true, ticons: true, font: 'Segoe UI',
  ntpTitle: 'Vibe Browser', ntpClock: true, ntpSearch: true, showMarks: true, ntpBg: 'grad',
  engine: 'yandex', custom: '', omniDomain: false, omniSel: true, searchNew: false,
  startup: 'ntp', home: '', newPage: 'ntp',
  tabRight: false, popupBg: false, midClose: true, closeLast: false,
  zoom: 100, darkPages: false, ua: 'chrome', lang: 'ru-RU,ru;q=0.9,en;q=0.8', spell: true, images: true, js: true, noAutoplay: false,
  blockAds: false, dnt: false, thirdCookies: false, httpsOnly: false, blockPopups: true, pMedia: 'ask', pGeo: 'ask', pNotif: 'ask', clearOnExit: false,
  askDl: false, dlDir: '', dlPopup: true, dlNotify: true, dlOpen: false,
  histOn: true, histDays: '0', clearHistExit: false,
  onTop: false, startMax: false, noHw: false
};
let S = Object.assign({}, DEF, JSON.parse(localStorage.settings || '{}'));
const save = () => localStorage.settings = JSON.stringify(S);
const ENG = {
  yandex: ['Яндекс', 'https://yandex.ru/search/?text=%s', 'в Яндексе'],
  google: ['Google', 'https://www.google.com/search?q=%s', 'в Google'],
  bing: ['Bing', 'https://www.bing.com/search?q=%s', 'в Bing'],
  ddg: ['DuckDuckGo', 'https://duckduckgo.com/?q=%s', 'в DuckDuckGo'],
  custom: ['Свой адрес', '', 'в своём поисковике']
};
const mq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => INC || (S.theme === 'system' ? mq.matches : S.theme === 'dark');
let marks = JSON.parse(localStorage.marks || '[["Яндекс","https://yandex.ru"],["Википедия","https://ru.wikipedia.org"],["GitHub","https://github.com"],["YouTube","https://youtube.com"]]');
let hist = INC ? [] : JSON.parse(localStorage.history || '[]');
let dls = INC ? [] : JSON.parse(localStorage.downloads || '[]').map(d => d.state === 'progressing' ? { ...d, state: 'interrupted' } : d);
let tabs = [], active = null;

function theme() {
  const hue = S.hue, kk = S.vib / 60, dark = isDark();
  const L = (a, b, c) => `hsl(${(hue + a) % 360} ${Math.min(100, b * kk)}% ${c}%)`, r = document.documentElement.style;
  const T = dark
    ? { s: L(0,15,9), sc: L(0,12,15), sh: L(0,12,21), on: L(0,20,92), on2: L(0,10,70), p: L(0,70,78), onp: L(0,60,18), pc: L(0,38,27), onpc: L(0,70,90), tcc: L(60,25,28), ontc: L(60,45,90), scc: L(20,20,27), onsc: L(20,40,90), w1: L(0,45,16), w2: L(60,35,15) }
    : { s: L(0,40,97), sc: L(0,30,92), sh: L(0,28,88), on: L(0,20,12), on2: L(0,10,35), p: L(0,45,40), onp: '#fff', pc: L(0,75,88), onpc: L(0,60,16), tcc: L(60,55,88), ontc: L(60,50,15), scc: L(20,40,88), onsc: L(20,50,15), w1: L(0,80,90), w2: L(60,70,91) };
  for (const k in T) r.setProperty('--' + k, T[k]);
  r.setProperty('--k', S.k); r.colorScheme = dark ? 'dark' : 'light';
  $('#ntpq').placeholder = 'Искать ' + ENG[S.engine][2] + ' или ввести адрес';
  $('#ntph').textContent = INC ? 'Режим инкогнито' : (S.ntpTitle || 'Vibe Browser');
}
function norm(v) {
  v = v.trim(); if (!v) return null;
  if (/^https?:\/\//i.test(v)) return v;
  if (!v.includes(' ') && /^[^\s]+\.[^\s]{2,}$/.test(v)) return 'https://' + v;
  const tpl = (S.engine === 'custom' && S.custom.includes('%s')) ? S.custom : (ENG[S.engine][1] || ENG.yandex[1]);
  return tpl.replace('%s', encodeURIComponent(v));
}

/* ---------- история ---------- */
const saveHist = () => { if (!INC) localStorage.history = JSON.stringify(hist); };
function addHist(t, url) {
  if (INC || !S.histOn || !/^https?:/.test(url)) return;
  const h = hist[0];
  if (h && h.url === url && Date.now() - h.time < 3000) return;
  hist.unshift({ url, title: url, time: Date.now() });
  if (hist.length > 3000) hist.length = 3000;
  saveHist();
}
function dayLabel(d) {
  const n = new Date(), a = new Date(n.getFullYear(), n.getMonth(), n.getDate()), b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((a - b) / 864e5);
  return diff === 0 ? 'Сегодня' : diff === 1 ? 'Вчера' : d.toLocaleDateString('ru', { day: 'numeric', month: 'long', year: 'numeric' });
}
function drawHist() {
  const q = $('#hq').value.trim().toLowerCase(), box = $('#hlist'); box.innerHTML = '';
  const list = hist.filter(h => !q || h.title.toLowerCase().includes(q) || h.url.toLowerCase().includes(q)).slice(0, 300);
  if (!list.length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = INC ? 'В режиме инкогнито история не сохраняется.' : 'История пуста.'; box.append(p); return; }
  let day = '';
  list.forEach(h => {
    const d = new Date(h.time), lab = dayLabel(d);
    if (lab !== day) { day = lab; const g = document.createElement('h3'); g.textContent = lab; box.append(g); }
    const r = document.createElement('div'); r.className = 'hrow';
    r.innerHTML = '<small class="t"></small><div class="nm"><b></b><small></small></div><button class="ib" title="Удалить из истории">×</button>';
    r.querySelector('.t').textContent = d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    r.querySelector('b').textContent = h.title || h.url;
    r.querySelector('.nm small').textContent = h.url;
    r.onclick = () => { closeAll(); go(h.url); };
    r.querySelector('button').onclick = e => { e.stopPropagation(); hist.splice(hist.indexOf(h), 1); saveHist(); drawHist(); };
    box.append(r);
  });
}

/* ---------- загрузки ---------- */
const saveDl = () => { if (!INC) localStorage.downloads = JSON.stringify(dls.slice(0, 100)); };
const mb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' МБ' : Math.max(1, Math.round(n / 1024)) + ' КБ';
function drawDl() {
  const box = $('#dllist'); box.innerHTML = '';
  const busy = dls.filter(d => d.state === 'progressing').length;
  $('#dl').classList.toggle('busy', busy > 0);
  if (!dls.length) { const p = document.createElement('p'); p.className = 'muted'; p.style.margin = '6px'; p.textContent = 'Загрузок пока нет.'; box.append(p); }
  dls.slice(0, 30).forEach(d => {
    const r = document.createElement('div'); r.className = 'dl';
    r.innerHTML = '<span>📄</span><div class="nm"><b></b><div class="pb" hidden><i></i></div><small></small></div><span class="acts"></span>';
    r.querySelector('b').textContent = d.name;
    const sm = r.querySelector('small'), acts = r.querySelector('.acts');
    const btn = (t, f) => { const b = document.createElement('button'); b.className = 'sm'; b.textContent = t; b.onclick = f; b.style.marginLeft = '4px'; acts.append(b); };
    if (d.state === 'progressing') {
      const pct = d.total > 0 ? Math.round(d.received / d.total * 100) : 0;
      r.querySelector('.pb').hidden = false; r.querySelector('.pb i').style.width = (d.total > 0 ? pct : 100) + '%';
      sm.textContent = d.total > 0 ? `${pct}% · ${mb(d.received)} из ${mb(d.total)}` : mb(d.received);
      btn('Отмена', () => ipcRenderer.send('dl-cancel', d.id));
    } else if (d.state === 'completed') {
      sm.textContent = 'Завершено' + (d.total ? ' · ' + mb(d.total) : '');
      btn('Открыть', () => ipcRenderer.send('dl-open', d.path));
      btn('В папке', () => ipcRenderer.send('dl-show', d.path));
    } else sm.textContent = d.state === 'cancelled' ? 'Отменено' : 'Ошибка загрузки';
    box.append(r);
  });
}
ipcRenderer.on('dl', (_, m) => {
  let d = dls.find(x => x.id === m.id);
  if (m.type === 'start') { dls.unshift({ id: m.id, name: m.name, path: '', state: 'progressing', received: 0, total: m.total }); drawDl(); if (S.dlPopup) openPop('dlpop'); return; }
  if (!d) return;
  d.name = m.name || d.name;
  if (m.type === 'progress') { d.received = m.received; d.total = m.total; if (m.state === 'interrupted') d.state = 'interrupted'; }
  else {
    d.state = m.state; d.path = m.path; if (m.state === 'completed' && !d.total) d.total = d.received; saveDl();
    if (m.state === 'completed') {
      if (S.dlNotify) safe(() => new Notification('Загрузка завершена', { body: d.name }));
      if (S.dlOpen) ipcRenderer.send('dl-open', d.path);
    }
  }
  drawDl();
});

/* ---------- вкладки ---------- */
const UA = {
  chrome: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',

    const sl = mkEl('select'); r.o.forEach(([v, l]) => { const o = mkEl('option', '', l); o.value = v; sl.append(o); });
    sl.onchange = () => set(cast(sl.value)); r.sync = () => sl.value = String(S[r.k]); ctl.append(sl);
  } else if (r.t === 'seg') {
    const g = mkEl('div', 'seg'), bs = r.o.map(([v, l]) => { const b = mkEl('button', '', l); b.onclick = () => set(cast(v)); g.append(b); return [v, b]; });

    const v = mkEl('span', 'info'); v.style.minWidth = '46px'; i.oninput = () => set(+i.value);

  } else if (r.t === 'txt') {
    const i = mkEl('input'); i.type = 'text'; i.placeholder = r.ph || ''; i.spellcheck = false; i.oninput = () => set(i.value.trim());
    r.sync = () => { if (document.activeElement !== i) i.value = S[r.k]; }; ctl.append(i);
  } else if (r.t === 'btn') {
    const b = mkEl('button', 'btn', r.b); b.onclick = r.fn; ctl.append(b);
  } else if (r.t === 'info') {
    ctl.append(mkEl('span', 'info', r.v()));
  } else if (r.t === 'dir') {
    const i = mkEl('input'); i.type = 'text'; i.readOnly = true;
    const b = mkEl('button', 'btn', 'Выбрать'), x = mkEl('button', 'btn', '✕'); x.title = 'Сбросить';
    b.onclick = async () => { const p = await ipcRenderer.invoke('pick-dir'); if (p) set(p); };
    x.onclick = () => set('');
    r.sync = () => i.value = S.dlDir || 'Папка «Загрузки»'; ctl.append(i, b, x);
  } else if (r.t === 'hues') {
    ctl.className = 'ctl sw';
    const bs = hues.map(h => { const b = mkEl('button'); b.style.background = `hsl(${h} 60% 55%)`; b.title = h + '°'; b.onclick = () => set(h); ctl.append(b); return [h, b]; });
    r.k = 'hue'; r.sync = () => bs.forEach(([h, b]) => b.classList.toggle('sel', h === S.hue));
  } else if (r.t === 'marks') {
    const list = mkEl('div'); list.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;width:100%';
    const a = mkEl('input'), u = mkEl('input'), add = mkEl('button', 'btn', 'Добавить');

    r.sync = () => { list.innerHTML = ''; marks.forEach((m, n) => { const c = mkEl('button', 'btn', m[0] + ' ×'); c.title = m[1]; c.onclick = () => { marks.splice(n, 1); localStorage.marks = JSON.stringify(marks); drawLinks(); r.sync(); }; list.append(c); }); };
    add.onclick = () => { const url = norm(u.value); if (!a.value.trim() || !url) return; marks.push([a.value.trim(), url]); localStorage.marks = JSON.stringify(marks); a.value = u.value = ''; drawLinks(); r.sync(); };
    ctl.append(list, a, u, add);

}
function buildSet() {

}
function syncSet() {

  R.forEach(r => {
    if (r.sync) r.sync();

    r.el.style.display = !hide && (q ? r.el.dataset.s.includes(q) : r.c === cat) ? '' : 'none';

}

}
function tick() {

}
function sendCfg() {

    httpsOnly: S.httpsOnly, blockPopups: S.blockPopups, perm: { media: S.pMedia, geo: S.pGeo, notif: S.pNotif }, lang: S.lang, spell: S.spell,
    clearOnExit: S.clearOnExit, onTop: S.onTop, startMax: S.startMax, noHw: S.noHw });

let ht;
function apply() {
  save(); theme(); applyView(); syncSet(); drawLinks();
  clearTimeout(ht); ht = setTimeout(() => { sendCfg(); tabs.forEach(applyTab); drawTabs(); sync(); }, 120);
}
setInterval(tick, 5000);
addEventListener('beforeunload', () => { if (S.clearHistExit && !INC) localStorage.history = '[]'; });
mq.onchange = theme;

if (+S.histDays && !INC) { const lim = Date.now() - S.histDays * 864e5; hist = hist.filter(h => h.time > lim); saveHist(); }
theme(); applyView(); buildSet(); syncSet(); drawDl(); sendCfg();
(function start() {

  if (prev.length) { prev.forEach(u => newTab(u)); select(tabs[0]); }
  else newTab(!INC && S.startup === 'home' && S.home ? norm(S.home) : '');
